[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novamark"
version = "0.1.0"
description = "Governed research workforce: one request, an auditable memo, two human gates"
requires-python = ">=3.12"
dependencies = [
    "strands-agents>=1.0",
    "bedrock-agentcore>=1.0",
    "mcp>=1.0",
    "httpx>=0.28",
    "fastapi>=0.110",
    "aws-opentelemetry-distro>=0.20.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-processor-baggage==0.65b0",
    "opentelemetry-propagator-aws-xray==1.0.2",
    "opentelemetry-instrumentation-aws-lambda==0.65b0",
    "opentelemetry-instrumentation-botocore==0.65b0",
    "opentelemetry-instrumentation-logging==0.65b0",
    "opentelemetry-sdk-extension-aws>=2.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "uvicorn>=0.29",
    "requests>=2.31",
    "aws-cdk-lib>=2.170",
    "constructs>=10",
    "httpie>=3.2",
    "rich>=13",
    "strands-agents-evals>=1.7.0",
]

[tool.uv]
exclude-dependencies = [
    "opentelemetry-instrumentation-aio-pika",
    "opentelemetry-instrumentation-aiohttp-client",
    "opentelemetry-instrumentation-aiokafka",
    "opentelemetry-instrumentation-aiopg",
    "opentelemetry-instrumentation-asyncpg",
    "opentelemetry-instrumentation-boto3sqs",
    "opentelemetry-instrumentation-cassandra",
    "opentelemetry-instrumentation-celery",
    "opentelemetry-instrumentation-confluent-kafka",
    "opentelemetry-instrumentation-dbapi",
    "opentelemetry-instrumentation-django",
    "opentelemetry-instrumentation-falcon",
    "opentelemetry-instrumentation-flask",
    "opentelemetry-instrumentation-grpc",
    "opentelemetry-instrumentation-httpx",
    "opentelemetry-instrumentation-jinja2",
    "opentelemetry-instrumentation-kafka-python",
    "opentelemetry-instrumentation-mysql",
    "opentelemetry-instrumentation-mysqlclient",
    "opentelemetry-instrumentation-pika",
    "opentelemetry-instrumentation-psycopg2",
    "opentelemetry-instrumentation-pymemcache",
    "opentelemetry-instrumentation-pymongo",
    "opentelemetry-instrumentation-pymysql",
    "opentelemetry-instrumentation-pyramid",
    "opentelemetry-instrumentation-redis",
    "opentelemetry-instrumentation-remoulade",
    "opentelemetry-instrumentation-requests",
    "opentelemetry-instrumentation-sqlalchemy",
    "opentelemetry-instrumentation-sqlite3",
    "opentelemetry-instrumentation-starlette",
    "opentelemetry-instrumentation-system-metrics",
    "opentelemetry-instrumentation-threading",
    "opentelemetry-instrumentation-tornado",
    "opentelemetry-instrumentation-tortoiseorm",
    "opentelemetry-instrumentation-urllib",
    "opentelemetry-instrumentation-urllib3",
    "opentelemetry-instrumentation-wsgi",
    "opentelemetry-propagator-b3",
    "opentelemetry-propagator-jaeger",
    "opentelemetry-propagator-ot-trace",
]

[tool.setuptools]
packages = ["novamark", "novamark.process"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# smoke_test.py is a script against live mocks, not a unit test: only collect test_*.py
python_files = ["test_*.py"]
# The deployed tests bill model calls, so they run only when named: pytest tests/test_deployed.py
addopts = "--ignore=tests/test_deployed.py"
markers = ["allow_network: the test calls a deployment, so the no-network guard is off"]
