<text x="72" y="386" text-anchor="start" font-size="10.5" fill="#687078">rejection, back to the producer</text>
<text x="34" y="418" text-anchor="start" font-size="10.5" fill="#687078">published and escalated are terminal.</text>
<text x="34" y="440" text-anchor="start" font-size="10.5" fill="#687078">Every arrow hands on the same MemoState with its status changed.</text>
