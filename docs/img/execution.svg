<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="920" viewBox="0 0 1340 920" font-family="-apple-system, Segoe UI, Helvetica, Arial">
<rect width="1340" height="920" fill="#ffffff"/>
<defs><marker id="a687078" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#687078"/></marker></defs>
