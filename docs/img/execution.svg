<text x="34" y="38" font-size="20" font-weight="700" fill="#232f3e">Execution: how the orchestrator runs the transitions</text>
<text x="34" y="60" font-size="12" fill="#687078">Each pass of the loop runs the process that `status` names, and gets back a new state. Failures and telemetry are shown where they happen.</text>
<rect x="25" y="80" width="150" height="56" rx="8" fill="#ffffff" stroke="#232f3e" stroke-width="2"/>
<text x="100.0" y="104" text-anchor="middle" font-size="13.5" font-weight="600" fill="#232f3e">Client</text>
<text x="100.0" y="122" text-anchor="middle" font-size="11" fill="#687078">analyst or reviewer</text>
<line x1="100" y1="136" x2="100" y2="880" stroke="#687078" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="205" y="80" width="150" height="56" rx="8" fill="#ffffff" stroke="#ed7100" stroke-width="2"/>
<text x="280.0" y="104" text-anchor="middle" font-size="13.5" font-weight="600" fill="#232f3e">agent.py</text>
<text x="280.0" y="122" text-anchor="middle" font-size="11" fill="#687078">runtime entrypoint</text>
<line x1="280" y1="136" x2="280" y2="880" stroke="#687078" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="385" y="80" width="150" height="56" rx="8" fill="#ffffff" stroke="#ed7100" stroke-width="2"/>
<text x="460.0" y="104" text-anchor="middle" font-size="13.5" font-weight="600" fill="#232f3e">Orchestrator</text>
<text x="460.0" y="122" text-anchor="middle" font-size="11" fill="#687078">advance loop</text>
<line x1="460" y1="136" x2="460" y2="880" stroke="#687078" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="565" y="80" width="150" height="56" rx="8" fill="#ffffff" stroke="#ed7100" stroke-width="2"/>
<text x="640.0" y="104" text-anchor="middle" font-size="13.5" font-weight="600" fill="#232f3e">Process</text>
<text x="640.0" y="122" text-anchor="middle" font-size="11" fill="#687078">collect, analyse, synthesize</text>
<line x1="640" y1="136" x2="640" y2="880" stroke="#687078" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="745" y="80" width="150" height="56" rx="8" fill="#ffffff" stroke="#8c4fff" stroke-width="2"/>
<text x="820.0" y="104" text-anchor="middle" font-size="13.5" font-weight="600" fill="#232f3e">Strands agent</text>
<text x="820.0" y="122" text-anchor="middle" font-size="11" fill="#687078">one turn, then Bedrock</text>
<line x1="820" y1="136" x2="820" y2="880" stroke="#687078" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="925" y="80" width="150" height="56" rx="8" fill="#ffffff" stroke="#3f8624" stroke-width="2"/>
<text x="1000.0" y="104" text-anchor="middle" font-size="13.5" font-weight="600" fill="#232f3e">S3</text>
<text x="1000.0" y="122" text-anchor="middle" font-size="11" fill="#687078">snapshots</text>
<line x1="1000" y1="136" x2="1000" y2="880" stroke="#687078" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="1105" y="80" width="150" height="56" rx="8" fill="#ffffff" stroke="#687078" stroke-width="2"/>
<text x="1180.0" y="104" text-anchor="middle" font-size="13.5" font-weight="600" fill="#232f3e">CloudWatch</text>
<text x="1180.0" y="122" text-anchor="middle" font-size="11" fill="#687078">logs, spans</text>
<line x1="1180" y1="136" x2="1180" y2="880" stroke="#687078" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="100" y1="176" x2="280" y2="176" stroke="#687078" stroke-width="1.8" marker-end="url(#a687078)"/>
<text x="190.0" y="169" text-anchor="middle" font-size="10" fill="#687078">1 invoke(payload)</text>
<line x1="280" y1="216" x2="460" y2="216" stroke="#687078" stroke-width="1.8" marker-end="url(#a687078)"/>
<text x="370.0" y="209" text-anchor="middle" font-size="10" fill="#687078">2 start or decide_sync</text>
<text x="370" y="232" text-anchor="middle" font-size="9" fill="#687078">intake, or load the latest snapshot</text>
<rect x="410" y="250" width="480" height="266" rx="6" fill="none" stroke="#527fff" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="418" y="264" font-size="9.5" font-weight="700" fill="#527fff" letter-spacing="0.5">LOOP: WHILE STATUS NAMES A PROCESS</text>
<line x1="460" y1="292" x2="640" y2="292" stroke="#687078" stroke-width="1.8" marker-end="url(#a687078)"/>
<text x="550.0" y="285" text-anchor="middle" font-size="10" fill="#687078">3 STEPS[status](state, deps)</text>
<line x1="640" y1="338" x2="820" y2="338" stroke="#687078" stroke-width="1.8" marker-end="url(#a687078)"/>
<text x="730.0" y="331" text-anchor="middle" font-size="10" fill="#687078">4 model.ask(prompt)</text>
<text x="730" y="353" text-anchor="middle" font-size="9" fill="#687078">in a worker thread</text>
<rect x="735" y="366" width="170" height="42" rx="6" fill="#ffffff" stroke="#687078" stroke-width="1.5"/>
<text x="820.0" y="385" text-anchor="middle" font-size="10.5" fill="#232f3e">the agent loop: one Bedrock</text>
<text x="820.0" y="400" text-anchor="middle" font-size="10.5" fill="#232f3e">turn, no tools, text back</text>
<line x1="820" y1="426" x2="1180" y2="426" stroke="#8c4fff" stroke-width="1.4" stroke-dasharray="2 3" marker-end="url(#a8c4fff)"/>
<text x="1000.0" y="419" text-anchor="middle" font-size="9.5" fill="#8c4fff">span: model call</text>
<line x1="820" y1="452" x2="640" y2="452" stroke="#687078" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a687078)"/>
<text x="730.0" y="445" text-anchor="middle" font-size="9.5" fill="#687078">5 text</text>
<line x1="640" y1="484" x2="460" y2="484" stroke="#687078" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a687078)"/>
<text x="550.0" y="477" text-anchor="middle" font-size="9.5" fill="#687078">6 new state, status set to the next process</text>
<line x1="460" y1="506" x2="1180" y2="506" stroke="#8c4fff" stroke-width="1.4" stroke-dasharray="2 3" marker-end="url(#a8c4fff)"/>
<text x="820.0" y="499" text-anchor="middle" font-size="9.5" fill="#8c4fff">span: one per transition</text>
<rect x="240" y="536" width="1000" height="226" rx="6" fill="none" stroke="#ed7100" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="248" y="550" font-size="9.5" font-weight="700" fill="#ed7100" letter-spacing="0.5">ON FAILURE</text>
<text x="250" y="568" text-anchor="start" font-size="9.5" fill="#687078">a source fails (market, knowledge base)</text>
<rect x="560" y="548" width="160" height="42" rx="6" fill="#ffffff" stroke="#687078" stroke-width="1.5"/>
<text x="640.0" y="567" text-anchor="middle" font-size="10.5" fill="#232f3e">a gap is added to the</text>
<text x="640.0" y="582" text-anchor="middle" font-size="10.5" fill="#232f3e">state; the loop goes on</text>
<line x1="240" y1="606" x2="1240" y2="606" stroke="#ed7100" stroke-width="1" stroke-dasharray="3 4"/>
<text x="250" y="626" text-anchor="start" font-size="9.5" fill="#687078">evidence check or model JSON fails</text>
<line x1="640" y1="650" x2="460" y2="650" stroke="#d13212" stroke-width="1.8" marker-end="url(#ad13212)"/>
<text x="550.0" y="643" text-anchor="middle" font-size="10" fill="#687078">raises EvidenceError</text>
<line x1="460" y1="680" x2="280" y2="680" stroke="#d13212" stroke-width="1.8" marker-end="url(#ad13212)"/>
<text x="370.0" y="673" text-anchor="middle" font-size="10" fill="#687078">propagates</text>
<line x1="280" y1="710" x2="1180" y2="710" stroke="#d13212" stroke-width="1.8" marker-end="url(#ad13212)"/>
<text x="730.0" y="703" text-anchor="middle" font-size="10" fill="#687078">ERROR with traceback</text>
<line x1="280" y1="740" x2="104" y2="740" stroke="#d13212" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ad13212)"/>
<text x="192.0" y="733" text-anchor="middle" font-size="9.5" fill="#687078">HTTP 500, no new snapshot</text>
<line x1="460" y1="790" x2="1000" y2="790" stroke="#3f8624" stroke-width="1.8" marker-end="url(#a3f8624)"/>
<text x="730.0" y="783" text-anchor="middle" font-size="10" fill="#687078">7 save a snapshot, at a review or the end</text>
<line x1="460" y1="836" x2="104" y2="836" stroke="#687078" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a687078)"/>
<text x="282.0" y="829" text-anchor="middle" font-size="9.5" fill="#687078">8 review packet or result</text>
<rect x="1055" y="250" width="250" height="72" rx="6" fill="#ffffff" stroke="#687078" stroke-width="1.5"/>
<text x="1180.0" y="269" text-anchor="middle" font-size="10.5" fill="#232f3e">CloudWatch: INFO logs, and the</text>
<text x="1180.0" y="284" text-anchor="middle" font-size="10.5" fill="#232f3e">traceback when invoke fails.</text>
<text x="1180.0" y="299" text-anchor="middle" font-size="10.5" fill="#232f3e">Spans for each transition and</text>
<text x="1180.0" y="314" text-anchor="middle" font-size="10.5" fill="#232f3e">model call go to Transaction Search.</text>
<line x1="34" y1="896" x2="62" y2="896" stroke="#8c4fff" stroke-width="1.4" stroke-dasharray="2 3" marker-end="url(#a8c4fff)"/>
<text x="72" y="900" text-anchor="start" font-size="10" fill="#687078">span: end-state design, not instrumented yet (see code-reviews.md)</text>
</svg>