<text x="405.0" y="207" text-anchor="middle" font-size="11" fill="#687078">runs the orchestrator</text>
<rect x="680" y="150" width="210" height="110" rx="8" fill="#ffffff" stroke="#3f8624" stroke-width="2"/>
<text x="785.0" y="174" text-anchor="middle" font-size="13.5" font-weight="600" fill="#232f3e">Figures</text>
