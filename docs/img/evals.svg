<text x="785.0" y="207" text-anchor="middle" font-size="11" fill="#687078">and the trajectory</text>
<rect x="1020" y="150" width="168" height="110" rx="8" fill="#ffffff" stroke="#687078" stroke-width="2" stroke-dasharray="6 4"/>
