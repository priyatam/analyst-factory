<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880" font-family="-apple-system, Segoe UI, Helvetica, Arial">
<rect width="1240" height="880" fill="#ffffff"/>
<defs><marker id="a687078" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#687078"/></marker></defs>
<defs><marker id="aed7100" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#ed7100"/></marker></defs>
<defs><marker id="a8c4fff" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#8c4fff"/></marker></defs>
<defs><marker id="a3f8624" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#3f8624"/></marker></defs>
<defs><marker id="ad13212" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#d13212"/></marker></defs>
<text x="34" y="38" font-size="20" font-weight="700" fill="#232f3e">Identity: how the agent that ran the memo got its identity</text>
<text x="34" y="60" font-size="12" fill="#687078">Pills show who each component acts as. The client's identity gets through the door; the runtime role does the work.</text>
<rect x="20" y="80" width="160" height="56" rx="8" fill="#ffffff" stroke="#232f3e" stroke-width="2"/>
<text x="100.0" y="104" text-anchor="middle" font-size="13.5" font-weight="600" fill="#232f3e">Deployer</text>
<text x="100.0" y="122" text-anchor="middle" font-size="11" fill="#687078">cdk deploy</text>
<line x1="100" y1="136" x2="100" y2="840" stroke="#687078" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="210" y="80" width="160" height="56" rx="8" fill="#ffffff" stroke="#232f3e" stroke-width="2"/>
<text x="290.0" y="104" text-anchor="middle" font-size="13.5" font-weight="600" fill="#232f3e">Client</text>
<text x="290.0" y="122" text-anchor="middle" font-size="11" fill="#687078">analyst or reviewer</text>
<line x1="290" y1="136" x2="290" y2="840" stroke="#687078" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="400" y="80" width="160" height="56" rx="8" fill="#ffffff" stroke="#ed7100" stroke-width="2"/>
<text x="480.0" y="104" text-anchor="middle" font-size="13.5" font-weight="600" fill="#232f3e">AgentCore Runtime</text>
<text x="480.0" y="122" text-anchor="middle" font-size="11" fill="#687078">invoke endpoint</text>
<line x1="480" y1="136" x2="480" y2="840" stroke="#687078" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="590" y="80" width="160" height="56" rx="8" fill="#ffffff" stroke="#687078" stroke-width="2"/>
<text x="670.0" y="104" text-anchor="middle" font-size="13.5" font-weight="600" fill="#232f3e">IAM and STS</text>
<text x="670.0" y="122" text-anchor="middle" font-size="11" fill="#687078">identity and permissions</text>
<line x1="670" y1="136" x2="670" y2="840" stroke="#687078" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="780" y="80" width="160" height="56" rx="8" fill="#ffffff" stroke="#ed7100" stroke-width="2"/>
<text x="860.0" y="104" text-anchor="middle" font-size="13.5" font-weight="600" fill="#232f3e">agent.py</text>
<text x="860.0" y="122" text-anchor="middle" font-size="11" fill="#687078">runs as the runtime role</text>
<line x1="860" y1="136" x2="860" y2="840" stroke="#687078" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="970" y="80" width="160" height="56" rx="8" fill="#ffffff" stroke="#8c4fff" stroke-width="2"/>
<text x="1050.0" y="104" text-anchor="middle" font-size="13.5" font-weight="600" fill="#232f3e">Bedrock and S3</text>
<text x="1050.0" y="122" text-anchor="middle" font-size="11" fill="#687078">model and state</text>
<line x1="1050" y1="136" x2="1050" y2="840" stroke="#687078" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="40" y="156" width="1160" height="126" rx="6" fill="none" stroke="#687078" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="48" y="170" font-size="9.5" font-weight="700" fill="#687078" letter-spacing="0.5">ONCE, AT DEPLOY</text>
<line x1="100" y1="204" x2="670" y2="204" stroke="#687078" stroke-width="1.8" marker-end="url(#a687078)"/>
<text x="385.0" y="197" text-anchor="middle" font-size="10" fill="#687078">A create the runtime role, trusted by the AgentCore service</text>
<rect x="42.0" y="214" width="116" height="22" rx="11" fill="#ffffff" stroke="#232f3e" stroke-width="1.5"/>
<text x="100" y="229" text-anchor="middle" font-size="10" font-weight="600" fill="#232f3e">acts as: deployer</text>
<rect x="582.0" y="214" width="176" height="22" rx="11" fill="#ffffff" stroke="#687078" stroke-width="1.5"/>
<text x="670" y="229" text-anchor="middle" font-size="10" font-weight="600" fill="#687078">RuntimeRole now exists</text>
<line x1="100" y1="252" x2="480" y2="252" stroke="#687078" stroke-width="1.8" marker-end="url(#a687078)"/>
<text x="290.0" y="245" text-anchor="middle" font-size="10" fill="#687078">B create the runtime, naming that role</text>
<rect x="392.0" y="258" width="176" height="22" rx="11" fill="#ffffff" stroke="#ed7100" stroke-width="1.5"/>
<text x="480" y="273" text-anchor="middle" font-size="10" font-weight="600" fill="#ed7100">bound to: RuntimeRole</text>
<rect x="40" y="296" width="1160" height="528" rx="6" fill="none" stroke="#527fff" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="48" y="310" font-size="9.5" font-weight="700" fill="#527fff" letter-spacing="0.5">FOR EACH REQUEST</text>
<line x1="290" y1="340" x2="480" y2="340" stroke="#687078" stroke-width="1.8" marker-end="url(#a687078)"/>
<text x="385.0" y="333" text-anchor="middle" font-size="10" fill="#687078">1 POST /invocations, SigV4-signed</text>
<rect x="202.0" y="350" width="176" height="22" rx="11" fill="#ffffff" stroke="#527fff" stroke-width="1.5"/>
<text x="290" y="365" text-anchor="middle" font-size="10" font-weight="600" fill="#527fff">acts as: client principal</text>
<rect x="392.0" y="350" width="176" height="22" rx="11" fill="#ffffff" stroke="#527fff" stroke-width="1.5"/>
<text x="480" y="365" text-anchor="middle" font-size="10" font-weight="600" fill="#527fff">caller: client principal</text>
<line x1="480" y1="406" x2="670" y2="406" stroke="#687078" stroke-width="1.8" marker-end="url(#a687078)"/>
<text x="575.0" y="399" text-anchor="middle" font-size="10" fill="#687078">2 verify the signature and the invoke permission</text>
<line x1="670" y1="436" x2="480" y2="436" stroke="#687078" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a687078)"/>
<text x="575.0" y="429" text-anchor="middle" font-size="9.5" fill="#687078">allow, or 403 and nothing runs</text>
<line x1="480" y1="484" x2="670" y2="484" stroke="#687078" stroke-width="1.8" marker-end="url(#a687078)"/>
<text x="575.0" y="477" text-anchor="middle" font-size="10" fill="#687078">3 assume the runtime role</text>
<line x1="670" y1="514" x2="480" y2="514" stroke="#687078" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a687078)"/>
<text x="575.0" y="507" text-anchor="middle" font-size="9.5" fill="#687078">temporary credentials for the session</text>
<rect x="392.0" y="524" width="176" height="22" rx="11" fill="#ffffff" stroke="#ed7100" stroke-width="1.5"/>
<text x="480" y="539" text-anchor="middle" font-size="10" font-weight="600" fill="#ed7100">acts as: RuntimeRole</text>
<line x1="480" y1="580" x2="860" y2="580" stroke="#687078" stroke-width="1.8" marker-end="url(#a687078)"/>
<text x="670.0" y="573" text-anchor="middle" font-size="10" fill="#687078">4 start the session; invoke(payload)</text>
<rect x="772.0" y="590" width="176" height="22" rx="11" fill="#ffffff" stroke="#ed7100" stroke-width="1.5"/>
<text x="860" y="605" text-anchor="middle" font-size="10" font-weight="600" fill="#ed7100">acts as: RuntimeRole</text>
<line x1="860" y1="646" x2="1050" y2="646" stroke="#687078" stroke-width="1.8" marker-end="url(#a687078)"/>
<text x="955.0" y="639" text-anchor="middle" font-size="10" fill="#687078">5 InvokeModel, put snapshot</text>
<rect x="962.0" y="656" width="176" height="22" rx="11" fill="#ffffff" stroke="#ed7100" stroke-width="1.5"/>
<text x="1050" y="671" text-anchor="middle" font-size="10" font-weight="600" fill="#ed7100">caller: RuntimeRole</text>
<text x="385" y="626" text-anchor="middle" font-size="9" fill="#687078">the client's identity stops at the runtime; it is not passed on</text>
<rect x="640" y="696" width="340" height="42" rx="6" fill="#ffffff" stroke="#687078" stroke-width="1.5"/>
<text x="810.0" y="715" text-anchor="middle" font-size="10.5" fill="#232f3e">6 the saved record names who did what:</text>
<text x="810.0" y="730" text-anchor="middle" font-size="10.5" fill="#232f3e">values: model_id, produced_at, step</text>
<rect x="640" y="746" width="340" height="42" rx="6" fill="#fdf0ee" stroke="#d13212" stroke-width="1.5"/>
<text x="810.0" y="765" text-anchor="middle" font-size="10.5" fill="#232f3e">decisions: reviewer, as sent in the payload,</text>
<text x="810.0" y="780" text-anchor="middle" font-size="10.5" fill="#232f3e">not verified against the client's identity</text>
<line x1="860" y1="804" x2="294" y2="804" stroke="#687078" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a687078)"/>
<text x="577.0" y="797" text-anchor="middle" font-size="9.5" fill="#687078">7 review packet or result</text>
</svg>